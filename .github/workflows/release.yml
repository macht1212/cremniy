name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt (Linux/macOS)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-xkb1 libdbus-1-3 \
            libfuse2 file imagemagick librsvg2-bin \
            dpkg-dev fakeroot

      - name: Cache vcpkg binary archives (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-linux-libgit2-v1
          restore-keys: vcpkg-archives-linux-

      - name: Cache vcpkg binary archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-archives-windows-libgit2-v1
          restore-keys: vcpkg-archives-windows-

      - name: Cache vcpkg binary archives (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/vcpkg/archives
          key: vcpkg-archives-macos-libgit2-v1
          restore-keys: vcpkg-archives-macos-

      - name: Setup vcpkg (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install libgit2

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install libgit2:x64-windows

      - name: Setup vcpkg (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install libgit2

      - name: Download linuxdeploy tools (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build -S src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build -S src `
            -DCMAKE_BUILD_TYPE=Release `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build -S src \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DQT_FEATURE_opengl=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Package (Linux) - AppImage
        if: runner.os == 'Linux'
        run: |
          echo -e "[Desktop Entry]\nType=Application\nName=Cremniy\nExec=cremniy\nIcon=cremniy\nCategories=Development;IDE;" > cremniy.desktop
          rsvg-convert src/resources/icons/icon.svg -w 256 -h 256 -o cremniy.png
          export QML_SOURCES_PATHS=${{ github.workspace }}/src
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/cremniy \
            --desktop-file cremniy.desktop \
            --icon-file cremniy.png \
            --plugin qt \
            --output appimage
          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE=$(find . -maxdepth 1 -name '*.AppImage' -type f | head -n 1)
          mv "$APPIMAGE" "cremniy-${VERSION}-Linux.AppImage"

      - name: Package (Linux) - DEB
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G DEB
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(find . -maxdepth 1 -name '*.deb' -type f | head -n 1)
          mv "$DEB" "../cremniy-${VERSION}-Linux.deb"

      - name: Package (Windows) - ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item build/cremniy.exe package/
          $vcpkgBin = "vcpkg/installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) { Copy-Item "$vcpkgBin/*.dll" package/ }
          New-Item -ItemType Directory -Path "package/Resources/translations" -Force
          Copy-Item build/*.qm "package/Resources/translations/"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations package\cremniy.exe
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path package/* -DestinationPath "cremniy-$version-Windows.zip"

      - name: Package (Windows) - NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build
          cpack -G NSIS
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $installer = Get-ChildItem . -Filter '*.exe' | Where-Object { $_.Name -notlike "*uninstall*" -and $_.Name -notlike "cremniy.exe" } | Select-Object -First 1
          if ($installer) { Move-Item $installer.FullName "../cremniy-$version-Windows.exe" }

      - name: Package (macOS) - TAR.GZ
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp -r build/cremniy.app package/
          macdeployqt package/cremniy.app -always-overwrite
          cd package
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "../cremniy-${VERSION}-macOS.tar.gz" cremniy.app

      - name: Package (macOS) - DMG
        if: runner.os == 'macOS'
        run: |
          cd build
          cpack -G DragNDrop
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(find . -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          mv "$DMG" "../cremniy-${VERSION}-macOS.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cremniy-${{ runner.os }}-${{ github.ref_name }}
          path: |
            cremniy-*-Linux.AppImage
            cremniy-*-Linux.deb
            cremniy-*-Windows.zip
            cremniy-*-Windows.exe
            cremniy-*-macOS.tar.gz
            cremniy-*-macOS.dmg
          if-no-files-found: error

  build-rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:41

    steps:
      - name: Install git
        run: dnf install -y git tar

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build rpmdevtools git tar rsync \
            cmake gcc-c++ \
            qt6-qtbase-devel qt6-qttools-devel qt6-qtsvg-devel \
            desktop-file-utils \
            libgit2-devel \
            http-parser-devel

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Sync spec version with tag and disable Qt deploy
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:.*/Version:        ${TAG_VERSION}/" rpm/cremniy.spec
          # Добавляем -DCREMNIY_ENABLE_QT_DEPLOY=OFF в вызов %cmake, сохраняя остальные аргументы
          sed -i 's/%cmake\( .*\)$/%cmake -DCREMNIY_ENABLE_QT_DEPLOY=OFF\1/' rpm/cremniy.spec
          echo "version=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Build source tarball
        run: |
          STAGE_DIR="$(mktemp -d)/cremniy"
          mkdir -p "$STAGE_DIR"
          rsync -a --exclude='.git' ./ "$STAGE_DIR/"
          tar -C "$(dirname "$STAGE_DIR")" -czf \
            "$HOME/rpmbuild/SOURCES/cremniy-${{ env.version }}.tar.gz" cremniy

      - name: Copy spec file
        run: cp rpm/cremniy.spec "$HOME/rpmbuild/SPECS/"

      - name: Build RPM
        run: |
          echo '%debug_package %{nil}' >> ~/.rpmmacros
          rpmbuild -bb "$HOME/rpmbuild/SPECS/cremniy.spec"

      - name: Collect RPMs
        run: |
          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} dist/ \;
          find "$HOME/rpmbuild/SRPMS" -name '*.rpm' -exec cp {} dist/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: cremniy-rpm-${{ github.ref_name }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build
      - build-rpm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Show release files
        run: find artifacts -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}