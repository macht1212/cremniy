name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read


# ============================================================
# Linux / Ubuntu
# ============================================================

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-cursor-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-render-util0-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            libfuse2 \
            file \
            imagemagick \
            librsvg2-bin

      - name: Check Qt XCB plugin
        run: |
          echo "Qt installation:"
          qmake -query

          echo
          echo "Qt plugins:"
          find "$QT_ROOT_DIR/plugins" -maxdepth 2 -type f | sort || true

          echo
          echo "Checking XCB platform plugin..."

          if [ ! -f "$QT_ROOT_DIR/plugins/platforms/libqxcb.so" ]; then
            echo "ERROR: Qt XCB platform plugin was not found."
            echo "Expected:"
            echo "$QT_ROOT_DIR/plugins/platforms/libqxcb.so"
            exit 1
          fi

          echo "XCB plugin found."

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git

          ./vcpkg/bootstrap-vcpkg.sh

          ./vcpkg/vcpkg install libgit2

      - name: Configure CMake
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build \
            -S src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      # --------------------------------------------------------
      # DEB
      # --------------------------------------------------------

      - name: Build DEB package
        run: |
          cd build

          cpack -G DEB

      - name: Rename DEB package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          DEB=$(find build \
            -maxdepth 1 \
            -name '*.deb' \
            -type f \
            | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: DEB package was not created."
            exit 1
          fi

          cp "$DEB" \
            "cremniy-${VERSION}-Linux.deb"

          echo "Created DEB:"
          ls -lh "cremniy-${VERSION}-Linux.deb"

      # --------------------------------------------------------
      # AppImage
      # --------------------------------------------------------

      - name: Download linuxdeploy tools
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x \
            linuxdeploy-x86_64.AppImage \
            linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        run: |
          echo -e "[Desktop Entry]\nType=Application\nName=Cremniy\nExec=cremniy\nIcon=cremniy\nCategories=Development;IDE;" > cremniy.desktop

          rsvg-convert \
            src/resources/icons/icon.svg \
            -w 256 \
            -h 256 \
            -o cremniy.png

          export QML_SOURCES_PATHS="${{ github.workspace }}/src"

          ./linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/cremniy \
            --desktop-file cremniy.desktop \
            --icon-file cremniy.png \
            --plugin qt \
            --output appimage

          VERSION="${GITHUB_REF_NAME#v}"

          APPIMAGE=$(find . \
            -maxdepth 1 \
            -name '*.AppImage' \
            -type f \
            | head -n 1)

          if [ -z "$APPIMAGE" ]; then
            echo "ERROR: AppImage was not created."
            exit 1
          fi

          cp "$APPIMAGE" \
            "cremniy-${VERSION}-Linux.AppImage"

          echo "Created AppImage:"
          ls -lh "cremniy-${VERSION}-Linux.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cremniy-linux
          path: |
            cremniy-*-Linux.deb
            cremniy-*-Linux.AppImage
          if-no-files-found: error


# ============================================================
# Windows
# ============================================================

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git

          .\vcpkg\bootstrap-vcpkg.bat

          .\vcpkg\vcpkg install libgit2:x64-windows

      - name: Configure CMake
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build `
            -S src `
            -DCMAKE_BUILD_TYPE=Release `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      # --------------------------------------------------------
      # ZIP portable version
      # --------------------------------------------------------

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path package `
            -Force

          if (!(Test-Path "build\cremniy.exe")) {
            throw "build\cremniy.exe was not produced"
          }

          Copy-Item `
            "build\cremniy.exe" `
            "package\"

          # libgit2 and other vcpkg runtime DLLs
          $vcpkgBin = "vcpkg\installed\x64-windows\bin"

          if (!(Test-Path $vcpkgBin)) {
            throw "vcpkg bin directory was not found: $vcpkgBin"
          }

          Copy-Item `
            "$vcpkgBin\*.dll" `
            "package\"

          # Qt runtime
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --no-translations `
            "package\cremniy.exe"

          # Translations
          if (Test-Path "build\*.qm") {
            New-Item `
              -ItemType Directory `
              -Path "package\Resources\translations" `
              -Force

            Copy-Item `
              "build\*.qm" `
              "package\Resources\translations\"
          }

      - name: Build Windows ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''

          Compress-Archive `
            -Path package\* `
            -DestinationPath "cremniy-$version-Windows.zip"

      # --------------------------------------------------------
      # Windows EXE installer
      # --------------------------------------------------------

      - name: Build Windows installer
        shell: pwsh
        run: |
          cd build

          cpack -G NSIS

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''

          $installer = Get-ChildItem "build\*.exe" |
            Where-Object {
              $_.Name -notlike "*uninstall*" -and
              $_.Name -notlike "cremniy.exe"
            } |
            Select-Object -First 1

          if (!$installer) {
            Write-Host "Files in build directory:"
            Get-ChildItem "build"

            throw "Windows installer was not created"
          }

          Copy-Item `
            $installer.FullName `
            "cremniy-$version-Windows.exe"

          Write-Host "Created installer:"
          Get-Item "cremniy-$version-Windows.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cremniy-windows
          path: |
            cremniy-*-Windows.exe
            cremniy-*-Windows.zip
          if-no-files-found: error


# ============================================================
# macOS
# ============================================================

  build-macos:
    name: Build macOS packages
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git

          ./vcpkg/bootstrap-vcpkg.sh

          ./vcpkg/vcpkg install libgit2

      - name: Configure CMake
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build \
            -S src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      # --------------------------------------------------------
      # Portable TAR.GZ
      # --------------------------------------------------------

      - name: Prepare macOS application
        run: |
          mkdir -p package

          if [ ! -d "build/cremniy.app" ]; then
            echo "ERROR: build/cremniy.app was not created."
            exit 1
          fi

          cp -R \
            build/cremniy.app \
            package/

          macdeployqt \
            package/cremniy.app \
            -always-overwrite

      - name: Build macOS TAR.GZ
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          cd package

          tar -czf \
            "../cremniy-${VERSION}-macOS.tar.gz" \
            cremniy.app

      # --------------------------------------------------------
      # DMG
      # --------------------------------------------------------

      - name: Build macOS DMG
        run: |
          cd build

          cpack -G DragNDrop

      - name: Rename macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          DMG=$(find build \
            -maxdepth 1 \
            -name '*.dmg' \
            -type f \
            | head -n 1)

          if [ -z "$DMG" ]; then
            echo "ERROR: DMG was not created."
            exit 1
          fi

          cp "$DMG" \
            "cremniy-${VERSION}-macOS.dmg"

          echo "Created DMG:"
          ls -lh "cremniy-${VERSION}-macOS.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cremniy-macos
          path: |
            cremniy-*-macOS.dmg
            cremniy-*-macOS.tar.gz
          if-no-files-found: error


# ============================================================
# Fedora / RPM
# ============================================================

  build-rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest

    container:
      image: fedora:41

    steps:
      - name: Install git
        run: |
          dnf install -y \
            git \
            tar

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            git \
            tar \
            rsync \
            cmake \
            gcc-c++ \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            qt6-qtsvg-devel \
            desktop-file-utils \
            libgit2-devel \
            http-parser-devel

      - name: Setup rpmbuild tree
        run: |
          rpmdev-setuptree

      - name: Sync spec version with tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          sed -i \
            "s/^Version:.*/Version:        ${TAG_VERSION}/" \
            rpm/cremniy.spec

          echo "version=${TAG_VERSION}" >> "$GITHUB_ENV"

      - name: Build source tarball
        run: |
          STAGE_DIR="$(mktemp -d)/cremniy"

          mkdir -p "$STAGE_DIR"

          rsync -a \
            --exclude='.git' \
            ./ \
            "$STAGE_DIR/"

          tar \
            -C "$(dirname "$STAGE_DIR")" \
            -czf \
            "$HOME/rpmbuild/SOURCES/cremniy-${{ env.version }}.tar.gz" \
            cremniy

      - name: Copy spec file
        run: |
          cp \
            rpm/cremniy.spec \
            "$HOME/rpmbuild/SPECS/"

      - name: Build RPM
        run: |
          echo '%debug_package %{nil}' >> ~/.rpmmacros

          rpmbuild \
            -bb \
            "$HOME/rpmbuild/SPECS/cremniy.spec"

      - name: Collect RPMs
        run: |
          mkdir -p dist

          find "$HOME/rpmbuild/RPMS" \
            -name '*.rpm' \
            -exec cp {} dist/ \;

          find "$HOME/rpmbuild/SRPMS" \
            -name '*.rpm' \
            -exec cp {} dist/ \;

          echo "RPM packages:"
          ls -lh dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: cremniy-rpm
          path: dist/*.rpm
          if-no-files-found: error


# ============================================================
# GitHub Release
# ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-rpm

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Show release files
        run: |
          echo "Files that will be published:"
          find artifacts -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.rpm

          draft: false
          prerelease: false
          generate_release_notes: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}